<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi Digital PUMA IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        puma: {
                            50: '#fdf2f4', 100: '#fbe7eb', 500: '#df526b',
                            600: '#cb3550', 700: '#ab2940', 900: '#792433', 950: '#43101a'
                        }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f0a0d;
            background-image: radial-gradient(at 0% 0%, rgba(203, 53, 80, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(123, 36, 51, 0.08) 0px, transparent 50%);
            color: #f3f4f6; min-height: 100vh;
        }
        .clean-card { background: rgba(26, 15, 22, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(234, 127, 147, 0.15); }
        .clean-input { background: rgba(15, 10, 13, 0.9); border: 1px solid rgba(234, 127, 147, 0.25); color: #ffffff; }
        .clean-input:focus { border-color: #cb3550; box-shadow: 0 0 0 2px rgba(203, 53, 80, 0.2); outline: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <div id="app" class="flex-grow flex flex-col"></div>
    <footer class="py-6 text-center text-xs text-puma-300/60 border-t border-puma-900/40 clean-card mt-auto">
        <p>&copy; 2026 PUMA (President University Major Association). All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
